# Two interchangeable emulators for the LocalStack API on :4566. Only one can
# run at a time (shared host port) — use `just deploy-floci` or
# `just deploy-localstack` rather than a bare `docker compose up`.
#
# The docker.sock mounts aren't needed for DynamoDB, but both emulators run
# Lambdas as sibling containers, and the experiment/floci-java worktree deploys
# Lambdas to whatever emulator is serving :4566 — so keep them Lambda-capable.
services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    user: root

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
