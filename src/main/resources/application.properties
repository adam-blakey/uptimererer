uptimererer.state-table=uptimererer-state

# Dev Services would otherwise auto-start a LocalStack container on every
# dev/test run; Floci is run manually on :4566, so point at it explicitly.
quarkus.dynamodb.devservices.enabled=false
quarkus.dynamodb.sync-client.type=url

# The Lambda mock event server would otherwise collide with the HTTP server's
# ports (8080 dev / 8081 test). POST SQS events to these ports instead.
quarkus.lambda.mock-event-server.dev-port=8082
quarkus.lambda.mock-event-server.test-port=8083

%dev,test.uptimererer.create-table-on-start=true
%dev,test.quarkus.dynamodb.endpoint-override=http://localhost:4566
%dev,test.quarkus.dynamodb.aws.region=us-east-1
%dev,test.quarkus.dynamodb.aws.credentials.type=static
%dev,test.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%dev,test.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test
