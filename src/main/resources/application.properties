uptimererer.state-table=uptimererer-state
uptimererer.event-bus=uptimererer-bus
uptimererer.url-parameter-prefix=/uptimererer/urls/
uptimererer.check-timeout=10s
# uptimererer.notification-topic-arn is deliberately unset: the deploy tool
# provisions the SNS topic and injects the ARN into the checkererer function
# (UPTIMERERER_NOTIFICATION_TOPIC_ARN); without it, status flips are only logged.

# One artifact holds both Lambdas; QUARKUS_LAMBDA_HANDLER on the function picks
# which named handler runs. Default to the checkererer (also used by dev/test).
quarkus.lambda.handler=checkererer

# Dev Services would otherwise auto-start a LocalStack container on every
# dev/test run; Floci is run manually on :4566, so point at it explicitly.
quarkus.dynamodb.devservices.enabled=false
quarkus.dynamodb.sync-client.type=url
quarkus.ssm.devservices.enabled=false
quarkus.ssm.sync-client.type=url
quarkus.eventbridge.devservices.enabled=false
quarkus.eventbridge.sync-client.type=url
quarkus.sns.devservices.enabled=false
quarkus.sns.sync-client.type=url

# The Lambda mock event server would otherwise collide with the HTTP server's
# ports (8080 dev / 8081 test). POST SQS events to these ports instead.
quarkus.lambda.mock-event-server.dev-port=8082
quarkus.lambda.mock-event-server.test-port=8083

%dev,test.uptimererer.create-table-on-start=true

%dev,test.quarkus.dynamodb.endpoint-override=http://localhost:4566
%dev,test.quarkus.dynamodb.aws.region=us-east-1
%dev,test.quarkus.dynamodb.aws.credentials.type=static
%dev,test.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%dev,test.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

%dev,test.quarkus.ssm.endpoint-override=http://localhost:4566
%dev,test.quarkus.ssm.aws.region=us-east-1
%dev,test.quarkus.ssm.aws.credentials.type=static
%dev,test.quarkus.ssm.aws.credentials.static-provider.access-key-id=test
%dev,test.quarkus.ssm.aws.credentials.static-provider.secret-access-key=test

%dev,test.quarkus.eventbridge.endpoint-override=http://localhost:4566
%dev,test.quarkus.eventbridge.aws.region=us-east-1
%dev,test.quarkus.eventbridge.aws.credentials.type=static
%dev,test.quarkus.eventbridge.aws.credentials.static-provider.access-key-id=test
%dev,test.quarkus.eventbridge.aws.credentials.static-provider.secret-access-key=test

%dev,test.quarkus.sns.endpoint-override=http://localhost:4566
%dev,test.quarkus.sns.aws.region=us-east-1
%dev,test.quarkus.sns.aws.credentials.type=static
%dev,test.quarkus.sns.aws.credentials.static-provider.access-key-id=test
%dev,test.quarkus.sns.aws.credentials.static-provider.secret-access-key=test
